# Build and test pipeline.
#
# ASCII ONLY. GitHub Actions parses this file as UTF-8, but keeping it
# pure ASCII avoids encoding surprises: a stray byte that a local
# editor wrote in the system code page can make the YAML parser reject
# the whole file, and the failure message then points at a line that
# looks perfectly fine. The same rule applies to the .bat scripts in
# scripts/ (those really do break under the ANSI code page).
#
# Three jobs:
#   core - the kernel, CLI, HTTP server and all tests, on three OSes.
#          BUILD_GUI=OFF, so no third-party dependency is involved and
#          the job works on any platform.
#   gcc  - an explicit GCC build. Not redundant: MSVC transitively
#          pulls in standard library headers (e.g. <algorithm>), which
#          hides missing includes. GCC does not, so this job exists to
#          expose "compiles on MSVC, does not compile on GCC" defects.
#          It has already caught one such bug in CI.
#   gui  - builds the Qt 6 GUI target and runs the offscreen smoke
#          test. Qt is pulled with jurplel/install-qt-action (aqtinstall).
#
# The differential test suites are registered as CTest tests (see the
# "diff_*" add_test() calls in CMakeLists.txt), so a plain
# "ctest --test-dir build" covers the unit tests AND every differential
# suite. That is why this workflow does not have a separate step for
# them: the ctest step below already runs all twelve tests.
name: Build and test

on:
  push:
    branches: [main, unified]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF -DBUILD_CLI=ON -DBUILD_SERVER=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      # Runs all twelve tests: the unit tests, the API unit tests,
      # the eight differential suites (whose reference implementation
      # is Python's decimal / fractions, sharing no code with the C++
      # kernel), and the two end-to-end API tests.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release

      # The differential suites are already covered by ctest above.
      # This step runs them a second time, but the other way round:
      # scripts/run_differential.py drives each suite directly and
      # reports which suite failed, which is what you want when a
      # failure has to be diagnosed rather than just re-run.
      #
      # verify_cli_oj.py needs the legacy executable for its part 1
      # (byte-for-byte comparison against the original implementation).
      # CI does not have it, so that part is skipped with a printed
      # reason and the script still exits 0. Parts 2, 3 and 4 (against
      # correct arithmetic, malformed-input robustness, and input-stream
      # alignment) do run.
      - name: Differential suites (verbose per-suite report)
        run: python scripts/run_differential.py --build build

  gcc:
    name: GCC compatibility build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF -DBUILD_CLI=ON -DBUILD_SERVER=ON -DBUILD_TESTS=ON
          -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release

  gui:
    # The GUI needs Qt 6, pulled with aqtinstall.
    #
    # It does NOT have to be pinned to MSVC: Qt 6.6.2 works with both
    # msvc2019_64 and mingw_64 on this project (measured locally: both
    # build the GUI target and pass the offscreen smoke test, ctest
    # 3/3). The linux job covers the MinGW-free path; the windows job
    # covers MSVC.
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt
        id: aqt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          modules: ''
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=ON -DBUILD_CLI=ON -DBUILD_SERVER=ON -DBUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH=${{ steps.aqt.outputs.qt_root_dir }}/${{ steps.aqt.outputs.qt_arch }}

      - name: Build
        run: cmake --build build --config Release

      # The offscreen platform plugin is required: without it the
      # smoke test exits with "Qt platform plugin failed to load"
      # rather than reporting a test failure.
      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release -R gui_smoke
